apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: security-experiments
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: infrastructure
  source:
    repoURL: http://gitea-http.gitea.svc:3000/infrastructure/infrastructure.git
    targetRevision: main
    path: charts/security-experiment
    helm:
      releaseName: security-experiment
  destination:
    server: https://kubernetes.default.svc
    namespace: security-test-gitops
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
