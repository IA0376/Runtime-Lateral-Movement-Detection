# Tetragon observational only, no enforcement actions.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata: {name: security-experiment-connect}
spec:
  kprobes:
  - call: __sys_connect
    syscall: false
    args:
    - {index: 0, type: int}
    - {index: 1, type: sockaddr}
---
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata: {name: security-experiment-sensitive-open}
spec:
  kprobes:
  - call: security_file_open
    syscall: false
    args:
    - {index: 0, type: file}
    selectors:
    - matchArgs:
      - index: 0
        operator: Prefix
        values: ["/var/run/secrets/kubernetes.io/serviceaccount/", "/run/secrets/kubernetes.io/serviceaccount/"]
