apiVersion: v1
kind: ServiceAccount
metadata: {name: experiment-attacker, namespace: {{ .Release.Namespace }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: experiment-attacker, namespace: {{ .Release.Namespace }}}
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: experiment-attacker, namespace: {{ .Release.Namespace }}}
subjects: [{kind: ServiceAccount, name: experiment-attacker, namespace: {{ .Release.Namespace }}}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: experiment-attacker}

---
apiVersion: v1
kind: ServiceAccount
metadata: {name: experiment-reader, namespace: {{ .Release.Namespace }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: experiment-reader, namespace: {{ .Release.Namespace }}}
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: experiment-reader, namespace: {{ .Release.Namespace }}}
subjects: [{kind: ServiceAccount, name: experiment-reader, namespace: {{ .Release.Namespace }}}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: experiment-reader}
