kind: ZarfPackageConfig
metadata:
    name: openbao
    version: 1.0.0
components:
    - name: openbao-prerequisites
      required: true
      manifests:
        - name: openbao-prerequisites-appset
          namespace: openbao
          files:
            - manifests/openbao-prerequisites.yaml
    - name: openbao-seal-key
      required: true
      files:
        - source: scripts/prepare-seal-key.sh
          target: /tmp/lab-bash-openbao-hook
          executable: true
      actions:
        onDeploy:
          after:
            - cmd: /tmp/lab-bash-openbao-hook
    - name: openbao
      required: true
      charts:
        - name: openbao
          namespace: openbao
          url: https://openbao.github.io/openbao-helm
          repoName: openbao
          version: 0.29.5
          noWait: true
          valuesFiles:
            - values/openbao-input-values.yaml
    - name: openbao-images
      required: false
      images:
        - quay.io/openbao/openbao:2.6.2
