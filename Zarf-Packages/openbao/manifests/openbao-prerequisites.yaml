apiVersion: v1
kind: Namespace
metadata:
    name: openbao
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
    name: openbao-tls
    namespace: openbao
spec:
    dnsNames:
        - openbao
        - openbao.openbao
        - openbao.openbao.svc
        - openbao-active
        - openbao-active.openbao.svc
        - '*.openbao-internal'
        - '*.openbao-internal.openbao.svc'
    duration: 2160h
    issuerRef:
        kind: ClusterIssuer
        name: lab-ca
    privateKey:
        rotationPolicy: Always
    renewBefore: 720h
    secretName: openbao-tls
