apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infrastructure
  namespace: argocd

spec:
  description: Infrastructure GitOps project

  sourceRepos:
    - >-
      http://gitea-http.gitea.svc:3000/infrastructure/*

  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"

  clusterResourceWhitelist:
    - group: "*"
      kind: "*"

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  roles:
    - name: tenant-admin

      description: Administrator for infrastructure applications

      policies:
        - >-
          p, proj:infrastructure:tenant-admin,
          applications, *, infrastructure/*, allow