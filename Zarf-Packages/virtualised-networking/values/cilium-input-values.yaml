cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
gatewayAPI:
  enabled: true
hubble:
  enabled: true
  peerService:
    clusterDomain: cluster.lab
  relay:
    enabled: true
    nodeSelector:
      kubernetes.io/hostname: cp-node-03
  ui:
    enabled: true
    ingress:
      enabled: false
    service:
      type: ClusterIP
    nodeSelector:
      kubernetes.io/hostname: cp-node-03
ingressController:
  default: true
  enabled: false
  enforceHttps: false
  loadbalancerMode: dedicated
ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4MaskSize: 24
    clusterPoolIPv4PodCIDRList:
      - 10.244.0.0/16
ipv6:
  enabled: false
k8sServiceHost: localhost
k8sServicePort: "6443"
kubeProxyReplacement: true
l2announcements:
  enabled: true
securityContext:
  privileged: true
