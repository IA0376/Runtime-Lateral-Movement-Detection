apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitea
  namespace: gitea
spec:
  parentRefs:
    - name: web
      namespace: web-gateway
      sectionName: https
  hostnames: [gitea.cluster.lab]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: gitea-http
          port: 3000
