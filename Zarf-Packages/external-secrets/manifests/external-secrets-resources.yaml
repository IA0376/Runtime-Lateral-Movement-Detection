apiVersion: v1
kind: ServiceAccount
metadata:
    name: eso-openbao
    namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
    name: openbao
spec:
    conditions:
        - namespaces:
            - gitea
            - argocd
    provider:
        vault:
            auth:
                kubernetes:
                    mountPath: kubernetes
                    role: eso-applications
                    serviceAccountRef:
                        audiences:
                            - openbao
                        name: eso-openbao
                        namespace: external-secrets
            caProvider:
                key: ca.crt
                name: openbao-tls
                namespace: openbao
                type: Secret
            path: secret
            server: https://openbao.openbao.svc:8200
            version: v2
