apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
    name: lab-selfsigned
spec:
    selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
    name: lab-ingress-root
    namespace: cert-manager
spec:
    commonName: Lab Ingress Root CA
    duration: 87600h
    isCA: true
    issuerRef:
        kind: ClusterIssuer
        name: lab-selfsigned
    privateKey:
        algorithm: ECDSA
        rotationPolicy: Never
        size: 256
    renewBefore: 8760h
    secretName: lab-ingress-root
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
    name: lab-ca
spec:
    ca:
        secretName: lab-ingress-root
