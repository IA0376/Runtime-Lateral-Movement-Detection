kind: ZarfPackageConfig
metadata:
    name: cert-manager
    version: 1.0.0
components:
    - name: cert-manager
      required: true
      charts:
        - name: cert-manager
          namespace: cert-manager
          url: https://charts.jetstack.io
          repoName: cert-manager
          version: v1.21.2
          valuesFiles:
            - values/cert-manager-input-values.yaml
    - name: cert-manager-resources
      required: true
      manifests:
        - name: cert-manager-resources-appset
          namespace: cert-manager
          files:
            - manifests/cert-manager-resources.yaml
    - name: cert-manager-images
      required: false
      images:
        - quay.io/jetstack/cert-manager-cainjector:v1.21.2
        - quay.io/jetstack/cert-manager-controller:v1.21.2
        - quay.io/jetstack/cert-manager-startupapicheck:v1.21.2
        - quay.io/jetstack/cert-manager-webhook:v1.21.2
        - quay.io/jetstack/cert-manager-acmesolver:v1.21.2
        - quay.io/jetstack/cert-manager-cainjector:sha256-c85268c64f2e0e76684bf5fe8906caff34b82523561c6affe0fae3546bd87562.sig
        - quay.io/jetstack/cert-manager-controller:sha256-70f532fd9cfde0b09d55687200942399d89838bc2d5d5b45152eb799a15912b8.sig
        - quay.io/jetstack/cert-manager-startupapicheck:sha256-46e75b6866359ffb5d82624f41e3ed1c70b2994982702ced547ce5edb418a8f5.sig
        - quay.io/jetstack/cert-manager-webhook:sha256-a60e2dac46dbb8a7f3df95c54ce941012f54c2fe022f0ee55aaa1ab40ed957ae.sig
        - quay.io/jetstack/cert-manager-acmesolver:sha256-699b40d622211ab7accad8a21b04c5fbaa1841ef7a12621e8de492dbe27b2503.sig
