{{- range list "tracee" "kubearmor" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lab-test-telemetry
  namespace: {{ . }}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab-test-telemetry
  namespace: {{ . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lab-test-telemetry
subjects:
  - kind: ServiceAccount
    name: lab-test-runner
    namespace: welcome
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lab-test-policy-evidence
rules:
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list]
  - apiGroups: [cilium.io]
    resources: [ciliumnetworkpolicies, tracingpolicies]
    verbs: [get, list]
  - apiGroups: [kyverno.io]
    resources: [clusterpolicies]
    verbs: [get, list]
  - apiGroups: [templates.gatekeeper.sh]
    resources: [constrainttemplates]
    verbs: [get, list]
  - apiGroups: [constraints.gatekeeper.sh]
    resources: ['*']
    verbs: [get, list]
  - apiGroups: [security.kubearmor.com]
    resources: [kubearmorpolicies]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lab-test-policy-evidence
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lab-test-policy-evidence
subjects:
  - kind: ServiceAccount
    name: lab-test-runner
    namespace: welcome
