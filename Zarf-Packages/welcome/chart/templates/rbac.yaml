{
  "apiVersion": "v1",
  "kind": "ServiceAccount",
  "metadata": {
    "name": "lab-test-runner",
    "namespace": "welcome"
  }
}
---
{
  "apiVersion": "rbac.authorization.k8s.io/v1",
  "kind": "ClusterRole",
  "metadata": {
    "name": "lab-test-status"
  },
  "rules": [
    {
      "apiGroups": [
        ""
      ],
      "resources": [
        "nodes",
        "namespaces",
        "pods",
        "services",
        "configmaps"
      ],
      "verbs": [
        "get",
        "list",
        "watch"
      ]
    },
    {
      "apiGroups": [
        "apps"
      ],
      "resources": [
        "deployments",
        "statefulsets",
        "daemonsets",
        "replicasets"
      ],
      "verbs": [
        "get",
        "list",
        "watch"
      ]
    },
    {
      "apiGroups": [
        "argoproj.io"
      ],
      "resources": [
        "applications"
      ],
      "verbs": [
        "get",
        "list",
        "watch"
      ]
    },
    {
      "apiGroups": [
        "external-secrets.io"
      ],
      "resources": [
        "externalsecrets",
        "secretstores",
        "clustersecretstores"
      ],
      "verbs": [
        "get",
        "list",
        "watch"
      ]
    },
    {
      "apiGroups": [
        "gateway.networking.k8s.io"
      ],
      "resources": [
        "gateways",
        "httproutes"
      ],
      "verbs": [
        "get",
        "list",
        "watch"
      ]
    },
    {
      "apiGroups": [
        "metrics.k8s.io"
      ],
      "resources": [
        "pods"
      ],
      "verbs": [
        "get",
        "list"
      ]
    }
  ]
}
---
{
  "apiVersion": "rbac.authorization.k8s.io/v1",
  "kind": "ClusterRoleBinding",
  "metadata": {
    "name": "lab-test-status"
  },
  "roleRef": {
    "apiGroup": "rbac.authorization.k8s.io",
    "kind": "ClusterRole",
    "name": "lab-test-status"
  },
  "subjects": [
    {
      "kind": "ServiceAccount",
      "name": "lab-test-runner",
      "namespace": "welcome"
    }
  ]
}
