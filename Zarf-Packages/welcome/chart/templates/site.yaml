apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: welcome-results}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources: {requests: {storage: 5Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: welcome
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  replicas: 1
  strategy: {type: Recreate, rollingUpdate: null}
  selector: {matchLabels: {app: welcome}}
  template:
    metadata:
      labels: {app: welcome}
    spec:
      nodeSelector:
        kubernetes.io/hostname: cp-node-02
      serviceAccountName: welcome-inventory
      automountServiceAccountToken: true
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
      containers:
        - name: portal
          image: {{ .Values.image | quote }}
          env:
            - {name: HOST, value: 0.0.0.0}
            - {name: PORT, value: "8080"}
            - {name: AUTH_REQUIRED, value: "false"}
            - {name: WEB_TESTS_ENABLED, value: "false"}
            - {name: RESULTS_DIR, value: /data/security-results}
            - {name: CHECKS_FILE, value: /data/validation/checks.json}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 2}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10}
          resources: {requests: {cpu: 25m, memory: 96Mi}, limits: {memory: 512Mi}}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: welcome-results}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: welcome}
spec:
  selector: {app: welcome}
  ports: [{name: http, port: 8080, targetPort: http}]
