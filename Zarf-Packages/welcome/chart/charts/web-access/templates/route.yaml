apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ (include "web-access.name" .) }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: web
      namespace: web-gateway
      sectionName: https
  hostnames: [{{ required "host is required" .Values.host | quote }}]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - group: ""
          kind: Service
          weight: 1
          name: {{ required "service is required" .Values.service }}
          port: {{ .Values.port }}
{{- if .Values.backendTLS }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: {{ (include "web-access.name" .) }}
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: {{ .Values.service }}
      sectionName: https
  validation:
    hostname: openbao.openbao.svc
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: openbao-backend-ca
{{- end }}
